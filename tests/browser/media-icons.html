<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gtuber + Gstream / 图标预览</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../shared/placeholder.css">
  <style>
    html{height:auto;background:#f4efde}body{display:block;overflow:auto;height:auto;min-height:100svh;background:#f4efde;padding:28px 24px;max-width:900px;margin:auto}
    .preview-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 24px}
    .preview-heading h1{font-size:16px;margin:0}
    .preview-heading a{font-size:12px}
    .icons{display:grid;grid-template-columns:1fr 1fr;gap:24px}
    .placeholder{width:100%;box-shadow:4px 4px #b6c5ad}
    .placeholder header{padding:6px 10px}
    .gtb header{background:#c8a48f}.gsm header{background:#d9ddcf}
    .placeholder-content{padding:24px 16px 16px}
    .preview-tile{width:224px;height:224px;border-width:12px;margin:0 auto 24px}.preview-tile img{width:192px;height:192px;margin:0}.gtb .preview-tile{box-shadow:12px 12px #302c22}.gsm .preview-tile{box-shadow:12px 12px #252b27}.preview-link{display:block;text-decoration:none}.sizes .app-picture{width:56px;height:56px}.sizes .app-picture img{width:48px;height:48px}
    .names{font-size:12px;min-height:24px}
    .sizes{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:18px;background:#273e34;padding:12px;color:#d9eacb}
    figure{display:grid;justify-items:center;gap:4px;margin:0}
    figure img{image-rendering:pixelated}
    figcaption{font-size:10px}
    .palette{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:24px}
    .palette i{width:14px;height:14px;border:1px solid #7e978c}
    .palette span{margin-left:6px}
    @media(max-width:620px){.icons{grid-template-columns:1fr}.preview-tile{width:168px;height:168px;border-width:9px}.preview-tile img{width:144px;height:144px}body{padding:20px 16px}.preview-heading{align-items:flex-start}.preview-heading h1{font-size:12px}}
  </style>
</head>
<body>
  <header class="preview-heading"><h1>UMWELT / 桌面图标</h1><a href="../../">查看本地桌面 ↗</a></header>
  <main class="icons">
    <article class="placeholder gtb">
      <header><strong>GTB.BIO</strong><span>视频平台</span></header>
      <div class="placeholder-content">
        <a class="preview-link" href="../../gtb/" aria-label="查看爬爬电子管占位页"><span class="app-picture gtb-picture preview-tile"><img src="../../gtb/assets/icon.png" width="192" height="192" alt="奶油色旧电视、绿色屏幕，暖陶粉桌面底框"></span></a>
        <h1 data-title="gtb">爬爬电子管</h1>
        <p class="names" data-names="gtb">Gtuber · ジーチューバー</p>
        <div class="sizes"><figure><img src="../../gtb/assets/icon.png" width="32" height="32" alt=""><figcaption>32 px</figcaption></figure><figure><span class="app-picture gtb-picture"><img src="../../gtb/assets/icon.png" width="48" height="48" alt=""></span><figcaption>桌面尺寸</figcaption></figure></div>
      </div>
    </article>
    <article class="placeholder gsm">
      <header><strong>GSM.BIO</strong><span>轻互动信息流</span></header>
      <div class="placeholder-content">
        <a class="preview-link" href="../../gsm/" aria-label="查看爬爬在线"><span class="app-picture gsm-picture preview-tile"><img src="../../gsm/assets/icon.svg" width="192" height="192" alt="橄榄绿像素终端对话框，灰绿桌面底框"></span></a>
        <h1 data-title="gsm">爬爬在线</h1>
        <p class="names" data-names="gsm">Gstream · ジー投稿</p>
        <div class="sizes"><figure><img src="../../gsm/assets/icon.svg" width="32" height="32" alt=""><figcaption>32 px</figcaption></figure><figure><span class="app-picture gsm-picture"><img src="../../gsm/assets/icon.svg" width="48" height="48" alt=""></span><figcaption>桌面尺寸</figcaption></figure></div>
      </div>
    </article>
  </main>
  <div class="palette"><span>暖陶色旧电视 / 灰绿终端对话框</span></div>
  <script type="module">
    import {gameTitle} from '../../shared/games.mjs';
    for(const id of ['gtb','gsm']){
      document.querySelector(`[data-title="${id}"]`).textContent=gameTitle(id,'zh');
      document.querySelector(`[data-names="${id}"]`).textContent=`${gameTitle(id,'en')} · ${gameTitle(id,'ja')}`;
    }
  </script>
</body>
</html>
