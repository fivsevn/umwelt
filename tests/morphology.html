<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morphology verification</title><link rel="stylesheet" href="../isopoda/sprites.css?v=morphology-4"><style>body{background:#293426;color:#dfddbf;font:14px monospace;margin:24px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{padding:12px;border:1px solid #7b8968;content-visibility:auto;contain-intrinsic-size:auto 240px}.art{height:110px;display:flex;align-items:center;justify-content:center;gap:28px}.art .isopod{transform:scale(2.6)}.neutral .isopod{filter:grayscale(1)}label{display:inline-block;margin:10px}button,select{font:inherit;padding:6px}iframe{border:1px solid #999}#metrics{white-space:pre-wrap}</style><h1>Morphology verification</h1><label>模式 <select id="mode"><option value="bench">5 benchmarks</option><option value="all">13 species</option><option value="stages">S / M / L</option><option value="curlbench">Curl capabilities</option><option value="conditions">molt / curl</option><option value="variants">4 stable blotches</option><option value="mobile">Mobile game 390 × 844</option></select></label><label><input id="neutral" type="checkbox">中性轮廓</label><main></main><pre id="metrics"></pre><script type="module">
import {SPECIES} from '../isopoda/species.mjs';import {makeIsopod} from '../isopoda/sprites.mjs';
const main=document.querySelector('main'),mode=document.querySelector('#mode');
function render(){main.replaceChildren();const which=mode.value;if(which==='mobile'){main.style.display='block';const frame=document.createElement('iframe');frame.src='../isopoda/';frame.width=390;frame.height=844;main.append(frame);frame.onload=async()=>{await frame.contentDocument.fonts.ready;const w=frame.contentWindow,d=frame.contentDocument,n=w.performance.getEntriesByType('navigation')[0];document.querySelector('#metrics').textContent=JSON.stringify({viewport:[390,844],domContentLoadedMs:Math.round(n.domContentLoadedEventEnd),loadMs:Math.round(n.loadEventEnd),overflow:d.documentElement.scrollWidth>390,animations:d.getAnimations().length,resources:w.performance.getEntriesByType('resource').map(r=>({name:r.name.split('/').pop(),bytes:r.encodedBodySize})),fontLoaded:d.fonts.check('12px Pixel')},null,2)};return}main.style.display='grid';
const list=which==='bench'?['ducky','bolivari','coros','echinatus','dairy'].map(id=>SPECIES.find(s=>s.id===id)):SPECIES.filter(s=>s.visual);
for(const p of list){if(which==='curlbench'&&!['dairy','diablo','ducky'].includes(p.id))continue;const options=which==='stages'?['S','M','L'].map(stage=>({stage})):['conditions','curlbench'].includes(which)?['normal','molt-anterior','molt-posterior','curled'].map(condition=>({condition})):which==='variants'?[0,1,2,3].map(seed=>({seed})): [{}];if(which==='variants'&&p.id!=='dairy')continue;
for(const opt of options){const card=document.createElement('section');card.className='card';const title=document.createElement('h2');title.textContent=p.id+' '+JSON.stringify(opt);const art=document.createElement('div');art.className='art';let visual=p.visual;
if(document.querySelector('#neutral').checked){visual=structuredClone(visual);for(const key of Object.keys(visual.palette))visual.palette[key]='#93998b';visual.patterns=[]}
art.append(makeIsopod(visual,opt));card.append(title,art);main.append(card)}}
requestAnimationFrame(()=>document.querySelector('#metrics').textContent=JSON.stringify({cards:main.children.length,anatomy:main.querySelectorAll('[data-region]').length,animations:document.getAnimations().length,overflow:document.documentElement.scrollWidth>innerWidth},null,2));}
mode.onchange=render;document.querySelector('#neutral').onchange=render;render();
</script><script type="module" src="./browser-checks.mjs"></script></html>
