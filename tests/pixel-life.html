<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel life verification</title><link rel="stylesheet" href="../isopoda/sprites.css?v=pixel-life-6"><style>body{background:#273020;color:#dcdabf;font:14px monospace;margin:20px}select,button{font:inherit;margin:6px;padding:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.pose{height:155px;border:1px solid #647452;display:flex;flex-direction:column;align-items:center;justify-content:center}.pose .isopod{transform:scale(1.7)}.pose label{margin-top:5px}#window{width:min(500px,90vw);aspect-ratio:1;position:relative;overflow:hidden}#habitat{width:100%;height:100%;image-rendering:pixelated;touch-action:none}#critters{position:absolute;inset:0;pointer-events:none}pre{white-space:pre-wrap}</style><h1>Pixel life verification</h1><label>品种<select id="species"></select></label><label>场景<select id="scene"></select></label><button id="mist">喷水</button><button id="lift">抬木片</button><button id="wait">等待</button><div id="window"><canvas id="habitat"></canvas><div id="critters"></div></div><p id="text"></p><pre id="status"></pre><div class="grid"></div><script type="module">
import {SPECIES} from '../isopoda/species.mjs';import {makeIsopod,POSTURES} from '../isopoda/sprites.mjs';import {ENCOUNTERS} from '../isopoda/encounters.mjs';import {createHabitat} from '../isopoda/habitat.mjs';
const $=s=>document.querySelector(s),state={seed:42,species:'dairy',humidity:70,cover:70,light:50,food:1,scene:{encounter:'antenna'}};
for(const p of SPECIES){const o=new Option(p.id,p.id);$('#species').append(o)}for(const e of ENCOUNTERS)$('#scene').append(new Option(e.title,e.id));
const habitat=createHabitat($('#habitat'),$('#critters'),()=>state);function reset(){state.species=$('#species').value;state.scene.encounter=$('#scene').value;habitat.reset();habitat.start();$('#text').textContent=ENCOUNTERS.find(e=>e.id===state.scene.encounter).lines[0];$('.grid').replaceChildren();for(const posture of POSTURES){const box=document.createElement('div');box.className='pose';box.append(makeIsopod(SPECIES.find(s=>s.id===state.species),{seed:42,condition:{posture,molt:posture==='molting'?'posterior':'none'}}));const label=document.createElement('label');label.textContent=posture;box.append(label);$('.grid').append(box)}}$('#species').onchange=reset;$('#scene').onchange=reset;for(const id of ['mist','lift','wait'])$('#'+id).onclick=()=>habitat.react(id);
setInterval(()=>{$('#status').textContent=JSON.stringify([...$('#critters').children].map(c=>({seed:c.dataset.seed,posture:c.dataset.posture,activity:c.dataset.activity,moving:c.classList.contains('moving'),occlusion:c.dataset.occlusion,position:c.style.transform})),null,2)},1000);reset();
</script></html>
