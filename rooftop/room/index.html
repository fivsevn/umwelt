<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>东东的房间 · 花农时代</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../rooftop.css"><link rel="stylesheet" href="./room.css"></head><body class="garage bedroom"><header class="topbar"><h1>东东的房间 <small>DongDong’s Room</small></h1><a id="preview" href="https://umwelt.fivsevn.com/rooftop/">上楼看看 <span class="upstairs-arrow" aria-hidden="true"></span></a></header><main class="editor-layout"><section class="workspace"><div class="canvas-wrap"><canvas id="room" width="480" height="360" aria-label="东东和小猪的房间"></canvas><div class="workspace-status"><p id="caption" class="world-card" aria-live="polite">换件衣服，再去照料花草。</p></div></div><div class="workspace-toolbar room-transfer"><div class="layout-transfer"><button id="exportRoom" type="button">导出房间 JSON</button><details class="transfer"><summary>导入</summary><div class="transfer-body"><p>恢复房间布置、东东衣服和小猪装饰。</p><button id="importRoom" type="button">选择 JSON 文件</button><input id="roomFile" type="file" accept=".json,application/json" hidden></div></details></div></div></section><aside class="note-column"><section class="catalog room-panel room-wardrobe"><h2>打开衣柜</h2><div id="outfits" class="categories"></div><h2>小猪的抽屉</h2><div id="decorations" class="categories"></div></section><section class="catalog room-panel room-activities"><h2>看看东东在忙什么</h2><div id="activities" class="categories"></div><label>朝向 <select id="facing"><option value="south">朝前</option><option value="west">朝左</option><option value="north">朝后</option><option value="east">朝右</option></select></label></section><section class="notebook"><h2>东东的手帐 <small>房间里的日常</small></h2><p class="note">每次刷新，东东和小猪都会随机换一套。小猪不太懂衣柜，但小猪喜欢吃东东做的饭。</p></section></aside></main><script type="module" src="./room.mjs"></script></body></html>
