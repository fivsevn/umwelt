<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>东东的房间 · 花农时代</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../rooftop.css">
    <link rel="stylesheet" href="./room.css">
    <link rel="stylesheet" href="../editor.css">
  </head>
  <body class="garage bedroom">
    <header class="topbar">
      <h1>东东的房间 <small>DongDong’s Room</small></h1>
      <a id="preview" href="https://umwelt.fivsevn.com/rooftop/">上楼看看 <span class="upstairs-arrow" aria-hidden="true"></span></a>
    </header>
    <main class="editor-layout">
      <section class="catalog room-panel room-wardrobe">
        <h2>东东的衣柜</h2>
        <div id="outfits" class="categories"></div>
        <h2>小猪的饰物</h2>
        <div id="decorations" class="categories"></div>
      </section>
      <section class="workspace">
        <div class="canvas-wrap">
          <canvas id="room" width="480" height="360" aria-label="东东和小猪的房间"></canvas>
          <div class="workspace-status">
            <p id="caption" class="world-card" aria-live="polite">换件衣服，再去照料花草。</p>
          </div>
        </div>
        <div class="workspace-toolbar room-transfer" aria-label="房间视角与文件">
          <div class="toolbar-view" role="group" aria-label="视角工具">
            <div id="editCameraControls"></div>
          </div>
          <div class="toolbar-layout" role="group" aria-label="房间操作">
            <div class="layout-transfer" role="group" aria-label="房间文件">
              <button id="exportRoom" type="button" aria-label="导出房间 JSON" title="导出房间 JSON">导出</button>
              <details class="transfer">
                <summary>导入</summary>
                <div class="transfer-body">
                  <p>恢复房间布置、东东衣服和小猪装饰。</p>
                  <button id="importRoom" type="button">选择 JSON 文件</button>
                  <input id="roomFile" type="file" accept=".json,application/json" hidden>
                </div>
              </details>
            </div>
          </div>
        </div>
      </section>
      <aside class="note-column">
        <section class="catalog room-panel room-activities">
          <div class="actor-toggles" role="group" aria-label="显示角色">
            <label><input id="person" type="checkbox" checked>东东</label>
            <label><input id="pig" type="checkbox" checked>小猪</label>
          </div>
          <h2>东东的活动</h2>
          <div id="activities" class="categories"></div>
          <label class="room-facing">朝向 <select id="facing"><option value="south">朝前</option><option value="west">朝左</option><option value="north">朝后</option><option value="east">朝右</option></select></label>
          <h2 class="pig-activity-title">小猪的活动</h2>
          <div id="pigActivities" class="categories"></div>
        </section>
        <section class="notebook">
          <h2>东东的手帐 <small>房间里的日常</small></h2>
          <p class="note">每次刷新，东东和小猪都会随机换一套。小猪不太懂衣柜，但小猪喜欢吃东东做的饭。</p>
        </section>
      </aside>
    </main>
    <script src="../3d/vendor/three.min.js"></script>
    <script type="module" src="./room.mjs"></script>
  </body>
</html>
