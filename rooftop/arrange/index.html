<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#454b3b"><title>东东的车库 · Horticultural Era</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../rooftop.css"></head><body class="editor garage">
<header class="topbar"><h1>东东的车库 <small>HORTICULTURAL ERA</small></h1><div class="garage-actions"><button id="export">打包带走 ↓</button><details class="transfer"><summary>拆箱 / 导入</summary><div class="transfer-body"><p>北天台和南阳台一起保存。导出的布局可以用于之后正式上线。</p><div class="control-row"><button id="importButton">拆开箱子</button></div><input id="importFile" type="file" accept=".json,application/json" hidden><textarea id="layoutText" rows="5" aria-label="布局 JSON" placeholder="也可以粘贴布局 JSON"></textarea><button id="importText">应用文本</button></div></details><button id="preview">上楼看看 ↗</button></div></header>
<main class="editor-layout"><section class="workspace"><div class="arrange-controls"><div class="scene-tabs" role="group" aria-label="阳台"><button data-scene="north" aria-pressed="true">北天台 · 5 × 3 m</button><button data-scene="south" aria-pressed="false">南阳台 · 3 × 1 m</button></div><div class="weather-controls" role="group" aria-label="场景天气"><label>天气 <select id="weatherSelect"><option value="auto">缓慢变化</option></select></label><label>时刻 <select id="timeSelect"><option value="auto">随时间</option></select></label><p id="weatherStatus"></p></div></div><section class="inspector"><div class="section-title"><h2 id="selectedName">挑一件东西</h2><span id="count"></span></div><div id="objectControls" hidden><div class="control-row"><label>横向 <input id="posX" type="number" step="1"></label><label>纵向 <input id="posY" type="number" step="1"></label></div><div class="size-control"><label for="scale">大小 <output id="scaleValue" for="scale">100%</output></label><div><button id="scaleDown" aria-label="缩小物件">−</button><input id="scale" type="range" min="0.5" max="2" step="0.05" value="1" aria-label="物件大小"><button id="scaleUp" aria-label="放大物件">＋</button></div></div><div class="control-row"><button id="rotate">旋转 90°</button><button id="duplicate">复制</button><button id="remove">移除</button></div></div><p class="hint">方向键微调 · R 旋转 · Delete 移除</p></section>
<div class="canvas-wrap"><canvas id="garden" width="640" height="520" tabindex="0" aria-label="阳台陈列画布，点击选择物件，拖动调整，方向键微调"></canvas></div><div class="workspace-toolbar"><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button><label><input id="grid" type="checkbox">网格</label><label><input id="snap" type="checkbox" checked>吸附</label><label><input id="person" type="checkbox" checked>东东</label><button id="clear">空场景</button><button id="restore">初始陈列</button></div><p id="message" role="status">点架上的东西拿出来，拖动摆放。陈列会留在这台设备上。</p></section>
<aside class="studio"><section class="notebook" aria-labelledby="notebookTitle"><h2 id="notebookTitle">东东的手帐 <small>植物与器物</small></h2><p id="notebookEmpty">从架上挑一株，或点一下天台上的植物。名字、养法和翻过的资料都记在这里。</p><div id="notebookBody" hidden><div class="note-heading"><canvas id="notePreview" width="96" height="96" aria-label="所选植物与花盆像素预览"></canvas><div><h3 id="noteName"></h3><p id="noteLatin"></p></div></div><p id="noteAliases"></p><p id="noteShape"></p><p id="noteCare"></p><div id="vesselControls" hidden><label for="potSelect">换一只盆</label><select id="potSelect"></select><p id="potReason"></p><p id="vesselNote"></p><a id="vesselSource" target="_blank" rel="noopener noreferrer"></a></div><details open><summary>翻过的资料</summary><ul id="noteSources"></ul></details></div><p class="note-foot">养法按品种与当地季节调整。花果是辨识用的画面，不代表全年同时出现。</p></section><section class="catalog"><h2>架上的东西 <small id="assetCount"></small></h2><input id="search" type="search" placeholder="找植物或器具…" aria-label="搜索物件"><div class="categories" id="categories" role="group" aria-label="物件分类"></div><div class="asset-grid" id="assets"></div></section>
</aside></main>
<script type="module" src="../app.mjs"></script></body></html>
