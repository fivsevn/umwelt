<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#454b3b"><title>花农时代 · 布置天台</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../rooftop.css"></head><body class="editor">
<header class="topbar"><a href="../" class="back">← 观赏</a><h1>花农时代 <small>布置天台</small></h1><button id="preview">预览陈列 ↗</button></header>
<main class="editor-layout"><section class="workspace"><div class="scene-tabs" role="group" aria-label="阳台"><button data-scene="north" aria-pressed="true">北天台 · 5 × 3 m</button><button data-scene="south" aria-pressed="false">南阳台 · 3 × 1 m</button></div><div class="canvas-wrap"><canvas id="garden" width="640" height="520" tabindex="0" aria-label="阳台陈列画布，点击选择物件，拖动调整，方向键微调"></canvas></div><div class="workspace-toolbar"><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button><label><input id="grid" type="checkbox">网格</label><label><input id="snap" type="checkbox" checked>吸附</label><label><input id="person" type="checkbox" checked>小人</label><button id="clear">空场景</button><button id="restore">初始陈列</button></div><p id="message" role="status">点击右侧物件添加，拖动调整位置。布局自动保存在本机。</p></section>
<aside class="studio"><section class="inspector"><div class="section-title"><h2 id="selectedName">选择一件物件</h2><span id="count"></span></div><div id="objectControls" hidden><div class="control-row"><label>横向 <input id="posX" type="number" step="1"></label><label>纵向 <input id="posY" type="number" step="1"></label><label>大小 <select id="scale"><option value="0.5">½</option><option value="0.75">¾</option><option value="1">1</option><option value="1.25">1¼</option><option value="1.3">1.3</option><option value="1.5">1½</option><option value="2">2</option></select></label></div><div class="control-row"><button id="rotate">旋转 90°</button><button id="duplicate">复制</button><button id="remove">移除</button></div></div><p class="hint">方向键微调 · R 旋转 · Delete 移除</p></section>
<section class="catalog"><h2>物件柜 <small id="assetCount"></small></h2><input id="search" type="search" placeholder="找植物或器具…" aria-label="搜索物件"><div class="categories" id="categories" role="group" aria-label="物件分类"></div><div class="asset-grid" id="assets"></div></section>
<details class="transfer"><summary>导出 / 导入陈列</summary><p>北天台和南阳台一起保存。导出的布局可以用于之后正式上线。</p><div class="control-row"><button id="export">导出 JSON</button><button id="importButton">导入 JSON</button></div><input id="importFile" type="file" accept=".json,application/json" hidden><textarea id="layoutText" rows="5" aria-label="布局 JSON" placeholder="也可以粘贴布局 JSON"></textarea><button id="importText">应用文本</button></details></aside></main>
<script type="module" src="../app.mjs"></script></body></html>
