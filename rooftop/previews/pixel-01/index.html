<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>花农时代 · 视觉样板 01</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
 <header><div><span class="eyebrow">五月七日 / 花农时代</span><h1>屋顶的一角 <small>视觉样板 01</small></h1></div><a href="https://github.com/fivsevn/umwelt/tree/preview/rooftop-3d-pixel-samples/docs/art/rooftop-pixel-01" target="_blank" rel="noopener">制作源稿 ↗</a></header>
 <div class="toolbar"><nav aria-label="选择样板"><button data-view="scene" aria-pressed="true">小场景</button><button data-view="ceramic-pot" aria-pressed="false">陶盆</button><button data-view="metal-rack" aria-pressed="false">花架</button><button data-view="doorway" aria-pressed="false">门与壁灯</button></nav><div class="actions"><button id="light" aria-pressed="false">傍晚</button><button id="orbit" aria-pressed="false">转一圈</button><button id="reset">归位</button></div></div>
 <div id="viewport" aria-busy="true"><canvas id="canvas" tabindex="0" aria-label="可旋转的三维视觉样板。拖动或左右方向键转向，上下方向键调整俯仰，加减键缩放。"></canvas><p id="status" role="status">正在打开屋顶的一角…</p><p class="hint">拖动转向 · 滚轮 / 双指缩放</p></div>
 <footer><p id="caption">陶盆、黑色铁花架与一扇旧门。</p><span>独立样板 · 等待确认</span></footer>
</main>
<script src="../../3d/vendor/three.min.js"></script>
<script type="module" src="./preview.mjs"></script>
</body>
</html>
