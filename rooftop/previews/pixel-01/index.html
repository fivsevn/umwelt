<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>花农时代 · 综合测试</title>
  <link rel="icon" href="data:,">
  <script>
    const target = new URL("../../", location.href);
    const source = new URLSearchParams(location.search);
    target.searchParams.set("stage", "background");
    for (const key of ["scene", "weather", "time", "season", "view"]) {
      if (source.has(key)) target.searchParams.set(key, source.get(key));
    }
    if (!target.searchParams.has("view")) target.searchParams.set("view", "terrace");
    location.replace(target.href);
  </script>
</head>
<body>
  <noscript><a href="../../?stage=background&amp;view=terrace">打开花农时代综合测试</a></noscript>
</body>
</html>
