<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#bdc2ca" />
    <title>花农时代 · Horticultural Era</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./rooftop.css?v=terrace-launch-02" />
    <link rel="stylesheet" href="./observer-controls.css" />
    <link rel="stylesheet" href="./terminal-shell.css" />
  </head>
  <body class="observation">
    <main class="roof-world">
      <canvas
        id="garden"
        width="640"
        height="520"
        aria-label="楼顶花园"
      ></canvas
      ><button
        id="sceneDoor"
        class="scene-door"
        aria-label="进入南阳台"
        title="进入南阳台"
      ></button>
      <aside id="environmentHud" class="environment-hud" aria-label="濠河环境信息"></aside>
      <div class="view-controls" role="group" aria-label="观察视角与操作">
        <div class="legacy-view-controls" hidden>
        <button
          type="button"
          data-view-mode="rotate"
          aria-label="转动画面"
          aria-pressed="true"
        >
          转动
        </button>
        <button
          type="button"
          data-view-mode="move"
          aria-label="移动画面"
          aria-pressed="false"
        >
          移动
        </button>
        <button type="button" id="viewReset" aria-label="复位画面">复位</button>
        </div>
      </div>
      <div class="corner-cards">
        <div id="statusLog" class="status-log" role="log" aria-label="天台动态" aria-live="polite" aria-relevant="additions" aria-atomic="false"></div>
        <div class="status-sources" hidden aria-hidden="true">
          <aside id="observerStatus" class="world-card status-card"></aside>
          <aside id="dongdongStatus" class="world-card status-card"></aside>
          <aside id="weatherCard" class="world-card weather-card"><p id="weatherStatus">风从楼群之间吹过。</p></aside>
          <aside id="actionCard" class="world-card action-card"><p id="actionStatus"></p></aside>
        </div>
        <nav class="status-actions" aria-label="天台操作">
          <button id="sceneCard" class="world-card" type="button">去南阳台看看。</button>
          <button id="notebookOpen" class="world-card" type="button" aria-controls="notebook" aria-expanded="false">翻翻东东的手帐。</button>
          <button id="musicToggle" class="world-card" type="button" aria-pressed="false" aria-label="隔壁的音乐，点击开启">听听隔壁的音乐。</button>
          <a id="returnWorld" class="world-card" href="../">去别处走走。</a>
          <a id="roomCard" class="world-card" href="./room/">回房间换衣服。</a>
          <a id="garageCard" class="world-card" href="./arrange/">去车库搬点东西上来。</a>
        </nav>
      </div>
      <section
        id="notebook"
        class="notebook observation-notebook"
        aria-labelledby="notebookTitle"
        hidden
      >
        <div class="notebook-title">
          <h2 id="notebookTitle">东东的手帐</h2>
          <button id="notebookClose" aria-label="合上手帐" type="button">
            ×
          </button>
        </div>
        <p id="notebookEmpty" hidden></p>
        <div id="notebookBody">
          <div class="note-heading">
            <canvas
              id="notePreview"
              width="96"
              height="96"
              aria-label="物件预览"
            ></canvas>
            <div>
              <h3 id="noteName"></h3>
              <p id="noteLatin"></p>
            </div>
          </div>
          <p id="noteShape"></p>
          <p id="noteComment" class="note-comment"></p>
          <details>
            <summary>翻过的资料</summary>
            <ul id="noteSources"></ul>
          </details>
        </div>
      </section>
    </main>
    <script src="./3d/vendor/three.min.js"></script>
    <script type="module" src="./app.mjs"></script>
    <script type="module" src="./terminal-shell.mjs"></script>
  </body>
</html>
