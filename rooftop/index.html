<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#bdc2ca" />
    <title>花农时代 · Horticultural Era</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./rooftop.css" />
  </head>
  <body class="observation">
    <main class="roof-world">
      <canvas
        id="garden"
        width="640"
        height="520"
        aria-label="楼顶花园"
      ></canvas
      ><button
        id="sceneDoor"
        class="scene-door"
        aria-label="进入南阳台"
        title="进入南阳台"
      ></button>
      <div class="view-controls" role="group" aria-label="画面操作">
        <button
          type="button"
          data-view-mode="rotate"
          aria-label="转动画面"
          aria-pressed="true"
        >
          转动
        </button>
        <button
          type="button"
          data-view-mode="move"
          aria-label="移动画面"
          aria-pressed="false"
        >
          移动
        </button>
        <button type="button" id="viewReset" aria-label="复位画面">复位</button>
      </div>
      <div class="corner-cards">
        <aside
          id="dongdongStatus"
          class="world-card status-card"
          aria-live="polite"
          hidden
        ></aside>
        <aside id="weatherCard" class="world-card weather-card" hidden>
          <p id="weatherStatus">风从楼群之间吹过。</p>
        </aside>
        <aside id="actionCard" class="world-card action-card" hidden>
          <p id="actionStatus"></p>
        </aside>
        <button
          id="musicToggle"
          hidden
          class="world-card"
          type="button"
          aria-pressed="false"
          aria-label="隔壁的音乐，点击开启"
        >
          听听隔壁的音乐。</button
        ><a id="roomCard" hidden class="world-card" href="./room/"
          >回房间换衣服。</a
        ><a id="garageCard" hidden class="world-card" href="./arrange/"
          >去车库搬点东西上来。</a
        ><a id="returnWorld" hidden class="world-card" href="../"
          >去别处走走。</a
        >
      </div>
      <section
        class="notebook observation-notebook"
        aria-labelledby="notebookTitle"
        hidden
      >
        <div class="notebook-title">
          <h2 id="notebookTitle">东东的手帐</h2>
          <button id="notebookClose" aria-label="合上手帐" type="button">
            ×
          </button>
        </div>
        <p id="notebookEmpty" hidden></p>
        <div id="notebookBody">
          <div class="note-heading">
            <canvas
              id="notePreview"
              width="96"
              height="96"
              aria-label="物件预览"
            ></canvas>
            <div>
              <h3 id="noteName"></h3>
              <p id="noteLatin"></p>
            </div>
          </div>
          <p id="noteShape"></p>
          <p id="noteComment" class="note-comment"></p>
          <details>
            <summary>翻过的资料</summary>
            <ul id="noteSources"></ul>
          </details>
        </div>
      </section>
    </main>
    <script src="./3d/vendor/three.min.js"></script>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
