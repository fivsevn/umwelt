<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#22281f"><meta name="description" content="等足目赋格。世界并不因为被看见，才开始发生。">
<title>ISOPODA FUGUE / 等足目赋格</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./style.css?v=quiet-ui-3"><link rel="stylesheet" href="./sprites.css?v=quiet-ui-3">
<link rel="stylesheet" href="../window-system.css?v=quiet-ui-4"><script type="importmap">{"imports":{"./habitat.mjs?v=pointer-1":"./habitat.mjs?v=appendage-3","./behaviors.mjs?v=appendage-2":"./behaviors.mjs?v=appendage-3","./interaction.mjs?v=pointer-1":"./interaction.mjs?v=touchhold-1"}}</script></head><body><div id="flash" aria-hidden="true"></div><main id="game">

<section id="titleCard" class="title-card application-card launch-card"><div class="window-title"><span>ISOPODA / 等足目赋格</span><a href="../" class="launch-close" aria-label="关闭窗口，返回桌面"><i class="window-glyph glyph-close" aria-hidden="true"></i></a></div><div class="empty-box"><div class="habitat-viewport"><canvas id="emptyHabitat" width="384" height="430" aria-label="饲养环境"></canvas><div id="emptyCritters" hidden></div></div></div><div class="title-links"><button id="startBtn">新建观察</button><button id="continueBtn" hidden>继续观察</button></div></section>
<section id="arrivalCard" class="arrival-card application-card" hidden aria-live="polite"><div class="result-panel"><div class="panel-caption">等待放入的个体</div><div id="arrivalSpecimens"></div></div><div class="dialog-actions"><button id="settleBtn" class="primary">开始观察</button></div></section>
<section id="playView" class="play-view" hidden><div id="boxFrame" class="box-frame"><div class="window-title"><span id="activityLabel" class="window-caption" aria-live="polite">ISOPODA / 饲养盒</span><div class="window-controls"><button id="windowMinimize" aria-label="最小化饲养窗口" aria-expanded="true"><i class="window-glyph glyph-min" aria-hidden="true"></i></button><button id="windowMaximize" aria-label="全屏饲养窗口" aria-pressed="false"><i class="window-glyph glyph-max" aria-hidden="true"></i></button><button id="windowClose" aria-label="关闭饲养窗口，返回首页"><i class="window-glyph glyph-close" aria-hidden="true"></i></button></div></div><div class="window-menu status-row"><div id="instruments" class="instruments" aria-label="饲养环境状态"></div><span class="time-sound"><span id="dayLabel"></span><button id="soundBtn" class="icon-button" aria-label="开启声音" aria-pressed="false"></button></span></div><div class="window-content"><div class="habitat-viewport"><canvas id="habitat" width="384" height="430" aria-label="七只鼠妇的饲养盒；可拖动观察" style="touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none" onselectstart="return false" ondragstart="return false"></canvas><div id="critters" aria-hidden="true"></div><div id="habitatLibrary" class="habitat-library"><button id="catalogBtn" class="icon-button field-button" aria-label="资料库"></button></div><div class="zoom-tools"><button id="zoomOut" aria-label="缩小观察">−</button><span id="zoomLevel">1×</span><button id="zoomIn" aria-label="放大观察">＋</button><button id="zoomReset" aria-label="复位观察">⌖</button></div></div><div class="window-story">
<section class="record" aria-live="polite"><div class="record-head"><span id="recordTitle"></span></div><p id="observation"></p><div id="miniView" hidden></div></section><section id="actions" class="actions" aria-label="本轮选择"></section>
<div class="bottom-bar"><button id="nextBtn" class="next-button" disabled>先留在这一刻</button><button id="journalBtn" class="icon-button field-button" aria-label="本轮笔记"></button></div></div></div></div></section>
<section id="endCard" class="end-card application-card" hidden><div class="window-title"><span id="endingTitle"></span><a href="../" class="launch-close" aria-label="关闭窗口，返回桌面"><i class="window-glyph glyph-close" aria-hidden="true"></i></a></div><div class="result-panel"><div id="endSpecimen" class="end-specimen"></div></div><div class="result-panel prose-panel"><div class="panel-caption ending-date"><span id="endingTime"></span><span>七日观察</span></div><p id="endingBody"></p></div><div class="result-panel prose-panel afterword"><div class="panel-caption">阿西莫夫的留言</div><p id="endingLine"></p></div><div class="dialog-actions"><button id="restartBtn" class="primary">再等一次偶然</button><button id="endingCatalogBtn" class="primary">查看资料库</button></div></section>
<p id="storageNotice" role="status" hidden></p>
<dialog id="drawer" tabindex="-1" autofocus><header><h2 id="drawerTitle"></h2><div class="drawer-tools"><button id="sourcesBtn" class="icon-button" aria-label="来源 / Credits"></button><button id="closeDrawer" aria-label="关闭"><i class="window-glyph glyph-close" aria-hidden="true"></i></button></div></header><nav id="drawerTabs" aria-label="所见之物分类"><button id="specimensTab" aria-pressed="true">标本</button><button id="endingsTab" aria-pressed="false">Epilogue</button></nav><div id="drawerContent"></div><footer><button id="pagePrev" aria-label="上一页">←</button><span id="pageNumber"></span><button id="pageNext" aria-label="下一页">→</button></footer></dialog>
</main><script type="module" src="./game.js?v=appendage-3"></script></body></html>
