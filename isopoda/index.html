<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#22281f"><meta name="description" content="等足目赋格。世界并不因为被看见，才开始发生。">
<title>ISOPODA FUGUE / 等足目赋格</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./style.css?v=cohort-4"><link rel="stylesheet" href="./sprites.css?v=cohort-4">
<link rel="stylesheet" href="../window-system.css?v=cohort-4"></head><body><div id="flash" aria-hidden="true"></div><main id="game">

<section id="titleCard" class="title-card application-card launch-card"><div class="window-title"><span>ISOPODA / 等足目赋格</span><a href="../" class="launch-close" aria-label="关闭窗口，返回桌面"><i class="window-glyph glyph-close" aria-hidden="true"></i></a></div><div class="empty-box"><div class="habitat-viewport"><canvas id="emptyHabitat" width="384" height="430" aria-label="饲养环境"></canvas><div id="emptyCritters" hidden></div></div></div><div class="title-links"><button id="startBtn">新建观察</button><button id="continueBtn" hidden>继续观察</button></div></section>
<section id="arrivalCard" class="arrival-card application-card" hidden aria-live="polite"><div class="window-title"><span>新建观察</span></div><div class="window-menu"><span>7 specimens</span><span>A–G / Day 1–7</span></div><div class="result-panel"><div class="panel-caption">等待放入的个体</div><div id="arrivalSpecimens"></div><h2 id="arrivalName"></h2></div><div class="result-panel prose-panel"><div class="panel-caption">阿西莫夫的笔记</div><p id="arrivalText"></p></div><div class="dialog-actions"><button id="settleBtn" class="primary">开始观察</button></div></section>
<section id="playView" class="play-view" hidden><div id="boxFrame" class="box-frame"><div class="window-title"><span id="activityLabel" class="window-caption" aria-live="polite">ISOPODA / 饲养盒</span><div class="window-controls"><button id="windowMinimize" aria-label="最小化饲养窗口" aria-expanded="true"><i class="window-glyph glyph-min" aria-hidden="true"></i></button><button id="windowMaximize" aria-label="全屏饲养窗口" aria-pressed="false"><i class="window-glyph glyph-max" aria-hidden="true"></i></button><button id="windowClose" aria-label="关闭饲养窗口，返回首页"><i class="window-glyph glyph-close" aria-hidden="true"></i></button></div></div><div class="window-toolbar"><span id="boxLabel" class="species-menu"></span><span id="dayLabel"></span><button id="catalogBtn" class="icon-button field-button" aria-label="资料库"></button><button id="soundBtn" class="icon-button" aria-label="开启声音" aria-pressed="false"></button></div><div id="instruments" class="window-menu instruments" aria-label="饲养环境状态"></div><div class="window-content"><div class="habitat-viewport"><canvas id="habitat" width="384" height="430" aria-label="七只鼠妇的饲养盒；可拖动观察"></canvas><div id="critters" aria-hidden="true"></div><div class="zoom-tools"><button id="zoomOut" aria-label="缩小观察">−</button><span id="zoomLevel">1×</span><button id="zoomIn" aria-label="放大观察">＋</button><button id="zoomReset" aria-label="复位观察">⌖</button></div></div><div class="window-story">
<section class="record" aria-live="polite"><div class="record-head"><span id="recordTitle"></span></div><p id="observation"></p><div id="miniView" hidden></div></section><section id="actions" class="actions" aria-label="本轮选择"></section>
<div class="bottom-bar"><button id="nextBtn" class="next-button" disabled>先留在这一刻</button></div></div></div></div></section>
<section id="endCard" class="end-card application-card" hidden><div class="window-title"><span>Epilogue</span><a href="../" class="launch-close" aria-label="关闭窗口，返回桌面"><i class="window-glyph glyph-close" aria-hidden="true"></i></a></div><div class="window-menu"><span id="endingTime"></span><span>七日观察</span></div><div class="result-panel"><div id="endSpecimen" class="end-specimen"></div><h2 id="endingTitle"></h2></div><div class="result-panel prose-panel"><p id="endingBody"></p></div><div class="result-panel prose-panel afterword"><div class="panel-caption">阿西莫夫的留言</div><p id="endingLine"></p></div><div class="archive-status"><span id="endingCount"></span><span id="endRecordsSlot"></span></div><div class="dialog-actions"><button id="restartBtn" class="primary">再等一次偶然</button></div></section>
<p id="storageNotice" role="status" hidden></p>
<dialog id="drawer"><header><h2 id="drawerTitle"></h2><div class="drawer-tools"><button id="sourcesBtn" class="icon-button" aria-label="来源 / Credits"></button><button id="closeDrawer" aria-label="关闭"><i class="window-glyph glyph-close" aria-hidden="true"></i></button></div></header><nav id="drawerTabs" aria-label="所见之物分类"><button id="specimensTab" aria-pressed="true">标本</button><button id="journalTab" aria-pressed="false">笔记</button><button id="endingsTab" aria-pressed="false">Epilogue</button></nav><div id="drawerContent"></div><footer><button id="pagePrev" aria-label="上一页">←</button><span id="pageNumber"></span><button id="pageNext" aria-label="下一页">→</button></footer></dialog>
</main><script type="module" src="./game.js?v=cohort-4"></script></body></html>
