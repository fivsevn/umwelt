name: Check independent GSM engine
on:
  push:
    branches: [main]
    paths: ['gsm/**', '.github/workflows/gsm-*.yml', '.github/scripts/prepare-site.mjs']
  pull_request:
    paths: ['gsm/**', '.github/workflows/gsm-*.yml', '.github/scripts/prepare-site.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r gsm/tools/requirements.txt
      - run: npm ci --prefix gsm/tools/engine
      - name: Exercise local preparation, review, replay, archive, rendering and verification
        run: |
          node --test gsm/tests/*.test.mjs tests/site-artifact.test.mjs
          python -m unittest discover -s gsm/tests -p 'test_*.py'
          node gsm/tools/publish.mjs validate
          node gsm/tools/publish.mjs build
          git diff --exit-code -- gsm/posts gsm/users gsm/assets/avatars gsm/data/feed.mjs gsm/accounts.json
      - name: Confirm reference repository stays a data-only input
        run: |
          test ! -e gsm/tools/engine/collect-opinions.js
          test ! -e gsm/tools/engine/opinion-sources.js
          test ! -e gsm/tools/engine/opinion-ptt.js
          git diff --exit-code -- README.md README_EN.md README_JA.md
