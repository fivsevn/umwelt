name: Rooftop regression
on:
  pull_request:
    paths:
      - "rooftop/**"
      - "assets/fonts/**"
      - "tests/browser/rooftop*.cjs"
      - ".github/workflows/rooftop-regression.yml"
  push:
    branches: [main]
    paths:
      - "rooftop/**"
      - "assets/fonts/**"
      - "tests/browser/rooftop*.cjs"
      - ".github/workflows/rooftop-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        suite: [rooftop-maintenance, rooftop-garage-layout, rooftop-room, rooftop-card-feed, rooftop-weapons]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser tooling
        timeout-minutes: 3
        run: |
          npm install --prefix "$RUNNER_TEMP/rooftop-browser" --no-package-lock --no-save --no-audit --no-fund --fetch-timeout=30000 --fetch-retries=2 playwright@1.62.1
      - name: Check scenes, editing and room persistence
        env:
          BROWSER: ${{ matrix.browser }}
          BASE_URL: http://127.0.0.1:8773
          NODE_PATH: ${{ runner.temp }}/rooftop-browser/node_modules
          QA_OUTPUT: ${{ runner.temp }}/rooftop-screenshots
        run: |
          mkdir -p "$QA_OUTPUT"
          python3 -m http.server 8773 --bind 127.0.0.1 > "$RUNNER_TEMP/rooftop-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$BASE_URL/rooftop/" > /dev/null; then break; fi
            sleep 1
          done
          node "tests/browser/${{ matrix.suite }}.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.suite }}-${{ matrix.browser }}
          path: ${{ runner.temp }}/rooftop-screenshots
          retention-days: 14
