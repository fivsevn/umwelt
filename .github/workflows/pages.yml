name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify observation game
        run: node --test tests/*.test.mjs

      - name: Verify public ISOPODA surface
        run: node isopoda/tools/check-public-surface.mjs

      - uses: actions/configure-pages@v5

      - name: Install font subsetting tools
        run: python -m pip install --disable-pip-version-check "fonttools>=4.55,<5" "brotli>=1.1,<2"

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude '_site/' \
            --exclude 'README.md' \
            --exclude 'docs/' \
            --exclude 'tests/' \
            --exclude 'isopoda/tools/' \
            --exclude 'isopoda/dev/' \
            --exclude 'isopoda/docs/' \
            --exclude 'isopoda/README.md' \
            --exclude 'isopoda/locales/README.md' \
            --exclude 'isopoda/morphology/README.md' \
            --exclude 'isopoda/scenery/README.md' \
            --exclude 'isopoda/anatomy-test.html' \
            ./ _site/

      - name: Subset deployed Pixel font
        run: |
          python .github/scripts/subset-font.py \
            --scan-root _site \
            --font _site/assets/fonts/fusion-pixel-12px-monospaced-zh_hans.ttf.woff2

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
