# redeploy: freshwater two-step observation cycle
name: Deploy static site to Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/README*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify runtime, data contracts and public surfaces
        run: node isopoda/tools/check-all.mjs

      - uses: actions/configure-pages@v5

      - name: Install font subsetting tools
        run: python -m pip install --disable-pip-version-check "fonttools>=4.55,<5" "brotli>=1.1,<2"

      - name: Prepare Pages artifact
        run: node .github/scripts/prepare-site.mjs _site

      - name: Subset deployed Pixel font
        run: |
          python .github/scripts/subset-font.py \
            --scan-root _site \
            --font _site/assets/fonts/fusion-pixel-12px-monospaced-zh_hans.ttf.woff2

      - name: Stamp deployed asset URLs with commit SHA
        run: node .github/scripts/stamp-assets.mjs _site "$GITHUB_SHA"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
