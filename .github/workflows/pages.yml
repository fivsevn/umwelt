# redeploy: freshwater two-step observation cycle
name: Deploy static site to Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/README*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify runtime, data contracts and public surfaces
        run: node isopoda/tools/check-all.mjs

      - uses: actions/configure-pages@v5

      - name: Install font subsetting tools
        run: python -m pip install --disable-pip-version-check "fonttools>=4.55,<5" "brotli>=1.1,<2"

      - name: Prepare Pages artifact
        run: node .github/scripts/prepare-site.mjs _site

      - name: Subset deployed Pixel font
        run: |
          python .github/scripts/subset-font.py \
            --scan-root _site \
            --font _site/assets/fonts/fusion-pixel-12px-monospaced-zh_hans.ttf.woff2

      - name: Stamp deployed asset URLs with commit SHA
        run: node .github/scripts/stamp-assets.mjs _site "$GITHUB_SHA"

      - name: Check the final artifact in Chromium and WebKit
        env:
          NODE_PATH: ${{ runner.temp }}/artifact-browser/node_modules
          BASE_URL: http://127.0.0.1:8794
          QA_OUTPUT: ${{ runner.temp }}/artifact-screenshots
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          npm install --prefix "$RUNNER_TEMP/artifact-browser" --no-package-lock --no-save playwright@1.62.1
          "$RUNNER_TEMP/artifact-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
          python3 -m http.server 8794 --bind 127.0.0.1 --directory _site > "$RUNNER_TEMP/artifact-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$BASE_URL/" > /dev/null; then break; fi
            sleep 1
          done
          node tests/browser/published-artifact.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-artifact-screenshots
          path: ${{ runner.temp }}/artifact-screenshots
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
