# redeploy: freshwater two-step observation cycle
name: Deploy static site to Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/README*.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify runtime, data contracts and public surfaces
        run: node isopoda/tools/check-all.mjs

      - uses: actions/configure-pages@v5

      - name: Install font subsetting tools
        timeout-minutes: 3
        run: python -m pip install --disable-pip-version-check --timeout 30 --retries 2 "fonttools>=4.55,<5" "brotli>=1.1,<2"

      - name: Prepare Pages artifact
        run: node .github/scripts/prepare-site.mjs _site

      - name: Subset deployed Pixel font
        run: |
          python .github/scripts/subset-font.py \
            --scan-root _site \
            --font _site/assets/fonts/fusion-pixel-12px-monospaced-zh_hans.ttf.woff2

      - name: Stamp deployed asset URLs with commit SHA
        run: node .github/scripts/stamp-assets.mjs _site "$GITHUB_SHA"

      - name: Prepare preinstalled browser environment
        timeout-minutes: 3
        run: |
          npm install --prefix "$RUNNER_TEMP/artifact-browser" --no-package-lock --no-save --no-audit --no-fund --fetch-timeout=30000 --fetch-retries=2 playwright@1.62.1
          docker pull mcr.microsoft.com/playwright:v1.62.1-noble

      - name: Check the final artifact in Chromium and WebKit
        # Forty desktop/mobile entries include the more detailed rooftop scene
        # on software WebGL. Keep all checks and allow the serial run to finish.
        timeout-minutes: 18
        env:
          NODE_PATH: ${{ runner.temp }}/artifact-browser/node_modules
          BASE_URL: http://127.0.0.1:8794
          QA_OUTPUT: ${{ runner.temp }}/artifact-screenshots
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 -m http.server 8794 --bind 127.0.0.1 --directory _site > "$RUNNER_TEMP/artifact-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$BASE_URL/" > /dev/null; then break; fi
            sleep 1
          done
          docker run --rm --network host --ipc host \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --volume "$RUNNER_TEMP:/qa" --workdir /repo \
            --env NODE_PATH=/qa/artifact-browser/node_modules \
            --env BASE_URL="$BASE_URL" --env EXPECTED_SHA="$EXPECTED_SHA" \
            --env QA_OUTPUT=/qa/artifact-screenshots \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            node tests/browser/published-artifact.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-artifact-screenshots
          path: ${{ runner.temp }}/artifact-screenshots
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Wait for Pages artifact visibility
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: node .github/scripts/wait-pages-artifact.mjs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
