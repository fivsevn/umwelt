name: Font subset check

on:
  push:
    paths:
      - '.github/scripts/subset-font.py'
      - '.github/workflows/font-subset-check.yml'
      - '.github/workflows/pages.yml'
      - 'assets/fonts/**'
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.mjs'
      - 'isopoda/credits*.md'
  pull_request:
    paths:
      - '.github/scripts/subset-font.py'
      - '.github/workflows/font-subset-check.yml'
      - '.github/workflows/pages.yml'
      - 'assets/fonts/**'
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.mjs'
      - 'isopoda/credits*.md'

jobs:
  subset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install font tooling
        run: python -m pip install 'fonttools[woff]>=4.58,<5'

      - name: Prepare public-site mirror
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude '_site/' \
            --exclude 'README.md' \
            --exclude 'docs/' \
            --exclude 'tests/' \
            --exclude 'isopoda/tools/' \
            --exclude 'isopoda/cohort.md' \
            --exclude 'isopoda/morphology.md' \
            --exclude 'isopoda/locales/README.md' \
            --exclude 'isopoda/morphology/README.md' \
            --exclude 'isopoda/scenery/README.md' \
            --exclude 'isopoda/anatomy-test.html' \
            --exclude 'isopoda/exploded-preview.html' \
            --exclude 'isopoda/exploded-preview.css' \
            --exclude 'isopoda/projection-preview.html' \
            ./ _site/

      - name: Build deployment font subset
        run: python .github/scripts/subset-font.py _site
