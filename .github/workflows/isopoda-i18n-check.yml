name: ISOPODA content checks

on:
  push:
    paths:
      - 'isopoda/**'
      - '.github/workflows/isopoda-i18n-check.yml'
  pull_request:
    paths:
      - 'isopoda/**'
      - '.github/workflows/isopoda-i18n-check.yml'

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Chinese / English / Japanese coverage
        run: node isopoda/tools/check-i18n.mjs
      - name: Check morphology page structure
        run: node isopoda/tools/check-morphology-page.mjs
