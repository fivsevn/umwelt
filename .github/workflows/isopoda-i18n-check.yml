name: ISOPODA checks

on:
  push:
    paths:
      - 'isopoda/**'
      - 'tick/**'
      - 'index.html'
      - 'assets/fonts/**'
      - 'tests/**'
      - '.github/scripts/subset-font.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/isopoda-i18n-check.yml'
  pull_request:
    paths:
      - 'isopoda/**'
      - 'tick/**'
      - 'index.html'
      - 'assets/fonts/**'
      - 'tests/**'
      - '.github/scripts/subset-font.py'
      - '.github/workflows/pages.yml'
      - '.github/workflows/isopoda-i18n-check.yml'

concurrency:
  group: isopoda-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run game and data tests
        run: node --test tests/*.test.mjs
      - name: Check Chinese / English / Japanese coverage
        run: node isopoda/tools/check-i18n.mjs
      - name: Check morphology page structure
        run: node isopoda/tools/check-morphology-page.mjs
      - name: Install font subsetting tools
        run: python -m pip install --disable-pip-version-check "fonttools>=4.55,<5" "brotli>=1.1,<2"
      - name: Check deploy font subset
        run: |
          mkdir -p _fontcheck
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude '_site/' \
            --exclude '_fontcheck/' \
            --exclude 'README.md' \
            --exclude 'docs/' \
            --exclude 'tests/' \
            --exclude 'isopoda/tools/' \
            --exclude 'isopoda/cohort.md' \
            --exclude 'isopoda/morphology.md' \
            --exclude 'isopoda/locales/README.md' \
            --exclude 'isopoda/morphology/README.md' \
            --exclude 'isopoda/scenery/README.md' \
            --exclude 'isopoda/anatomy-test.html' \
            --exclude 'isopoda/exploded-preview.html' \
            --exclude 'isopoda/exploded-preview.css' \
            --exclude 'isopoda/projection-preview.html' \
            ./ _fontcheck/
          python .github/scripts/subset-font.py \
            --scan-root _fontcheck \
            --font _fontcheck/assets/fonts/fusion-pixel-12px-monospaced-zh_hans.ttf.woff2
