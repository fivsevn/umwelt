name: Prepare GSM forum update
run-name: Prepare GSM ${{ github.run_id }}
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gsm-operations
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r gsm/tools/requirements.txt
      - run: npm ci --prefix gsm/tools/engine
      - name: Read daily material and prepare locally
        run: |
          set -euo pipefail
          echo "GSM_WORK_DIR=$RUNNER_TEMP/gsm-current" >> "$GITHUB_ENV"
          node gsm/tools/update.mjs prepare --work "$RUNNER_TEMP/gsm-current"
      - name: Save preparation in gsm/operations without posting
        run: |
          set -euo pipefail
          node gsm/tools/operation-archive.mjs save --root "$GITHUB_WORKSPACE/gsm" --work "$GSM_WORK_DIR" --stage prepared
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || { echo 'Main changed during preparation; review current main before saving this operation.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- gsm/operations
          if ! git diff --cached --quiet; then
            git commit -m 'Archive prepared GSM operation'
            git push origin HEAD:main
          fi
