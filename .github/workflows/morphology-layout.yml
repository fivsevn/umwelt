name: Morphology layout regression
on:
  pull_request:
    paths:
      - 'isopoda/**'
      - 'assets/fonts/**'
      - 'index.html'
      - '*.css'
      - '.github/scripts/stamp-assets.mjs'
      - 'tests/browser/*.cjs'
      - 'tests/browser/*.mjs'
      - 'tests/support/browser-controls.cjs'
      - '.github/workflows/morphology-layout.yml'
  push:
    branches: [main]
    paths:
      - 'isopoda/**'
      - 'assets/fonts/**'
      - 'index.html'
      - '*.css'
      - '.github/scripts/stamp-assets.mjs'
      - 'tests/browser/*.cjs'
      - 'tests/browser/*.mjs'
      - 'tests/support/browser-controls.cjs'
      - '.github/workflows/morphology-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        suite: [morphology-layout, habitat-lab, estuary, intertidal, public-regression]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/morphology-browser" --no-package-lock --no-save playwright@1.62.1
          "$RUNNER_TEMP/morphology-browser/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Check responsive layout and interactions
        env:
          BROWSER: ${{ matrix.browser }}
          BASE_URL: http://127.0.0.1:8765
          QA_OUTPUT: ${{ runner.temp }}/${{ matrix.suite }}-screenshots
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/morphology-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$BASE_URL/isopoda/morphology/" > /dev/null; then break; fi
            sleep 1
          done
          if [ "${{ matrix.suite }}" = "intertidal" ]; then
            PLAYWRIGHT_MODULE="$RUNNER_TEMP/morphology-browser/node_modules/playwright/index.mjs" node tests/browser/intertidal.mjs
          else
            NODE_PATH="$RUNNER_TEMP/morphology-browser/node_modules" node "tests/browser/${{ matrix.suite }}.cjs"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.suite }}-${{ matrix.browser }}-screenshots
          path: ${{ runner.temp }}/${{ matrix.suite }}-screenshots
          retention-days: 14
