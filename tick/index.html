<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101310">
  <title>TICK / UMWELT</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="../assets/fonts/fusion-pixel-12px-monospaced-zh_hans.ttf.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="game" id="game">
    <header class="topbar">
      <a class="home" href="../" aria-label="返回 UMWELT">←</a>
      <span class="mark">TICK</span>
      <button class="about-button" id="aboutButton" type="button" aria-label="关于 UMWELT">?</button>
    </header>

    <section class="stage" aria-live="polite">
      <div class="field" id="field" aria-hidden="true">
        <div class="branch"></div>
        <div class="tick" id="tick">
          <i class="body"></i>
          <i class="leg l1"></i><i class="leg l2"></i><i class="leg l3"></i><i class="leg l4"></i>
          <i class="leg r1"></i><i class="leg r2"></i><i class="leg r3"></i><i class="leg r4"></i>
        </div>
        <div class="signal-rings" id="signalRings"><i></i><i></i><i></i></div>
      </div>

      <div class="readout">
        <p class="eyebrow" id="eyebrow">TICK</p>
        <h1 id="signal">三个信号。</h1>
      </div>

      <button class="action" id="actionButton" type="button">开始</button>
    </section>
  </main>

  <section class="about" id="aboutPanel" hidden aria-modal="true" role="dialog" aria-labelledby="aboutTitle">
    <button class="about-close" id="aboutClose" type="button" aria-label="关闭">×</button>
    <div class="about-inner">
      <p>UMWELT</p>
      <h2 id="aboutTitle">環世界</h2>
      <p class="about-note">对蜱虫而言，少数信号就是整个世界。</p>
      <p class="citation">Jakob von Uexküll · 1934</p>
    </div>
  </section>

  <script src="./game.js"></script>
</body>
</html>
