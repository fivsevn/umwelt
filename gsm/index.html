<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e3bb61">
  <title>Gstream / 爬爬在线</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./physical-shell.css">
  <link rel="stylesheet" href="./pager-screen.css">
</head>
<body data-game="gsm" data-view="stream">
  <a class="skip-link" href="#timeline" data-skip>跳到 stream</a>
  <div class="phone-case">
  <div class="phone-shell">
    <div class="shell-face" aria-hidden="true"><picture><source data-shell-art-wide media="(max-height:550px) and (min-width:600px)"><img data-shell-art alt="" decoding="async" fetchpriority="high"></picture></div>
  <div class="app-window">
    <header class="app-header">
      <div class="masthead">
        <span class="brand-icon"><img src="./assets/icon.svg" width="72" height="72" alt=""></span>
        <h1><span class="title-slash">/</span><span class="title-text">G-stream</span><span class="title-dot">.</span></h1>
        <div class="pixel-stickers" aria-hidden="true"></div>
      </div>
    </header>
    <main id="timeline" tabindex="-1"><section id="profile" aria-labelledby="profileTitle" hidden></section><section id="posts" aria-label="信息流"></section><div class="stream-flourish" aria-hidden="true"></div></main>
  </div>
    <nav id="mainNav" class="stream-dock" aria-label="主导航">
      <a class="dock-button home-tab" id="homeButton" href="./../" data-home aria-label="返回 Umwelt 主页"></a>
      <a class="dock-button stream-tab" id="streamButton" href="./" aria-label="stream" aria-current="page"></a>
      <a class="dock-button settings-tab" id="settingsButton" href="./settings/" data-settings aria-label="设置"></a>
    </nav>
    <div class="shell-bottom" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">请启用 JavaScript 查看信息流。 / Enable JavaScript to view the feed.</p></noscript>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
