<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e8afad">
  <title>Gstream / 爬爬在线</title>
  <link rel="icon" type="image/png" href="../assets/icon.png">
  <link rel="stylesheet" href="../style.css">
</head>
<body data-game="gsm" data-view="settings">
  <a class="skip-link" href="#timeline" data-skip>跳到 stream</a>
  <div class="app-window">
    <header class="app-header">
      <div class="masthead">
        <span class="brand-icon"><img src="../assets/icon.png" width="90" height="90" alt=""></span>
        <h1><span class="title-slash">/</span><span class="title-text">G-stream</span><span class="title-dot">.</span></h1>
        <div class="pixel-stickers" aria-hidden="true"></div>
      </div>
    </header>
    <main id="timeline" tabindex="-1"><section class="settings-content post">
        <div class="settings-portrait" aria-hidden="true"></div>
        <div class="settings-card bubble"><h2 id="settingsTitle">设置</h2>
          <button type="button" class="settings-row" id="languageButton" data-language aria-label="语言：中文 · 切换为 English"><span data-language-label>语言</span><span data-language-value>中文</span></button>
        </div>
      </section></main>
    <nav id="mainNav" class="stream-dock" aria-label="主导航">
      <a class="dock-button home-tab" id="homeButton" href="../../" data-home aria-label="返回 Umwelt 主页"><span id="homeIcon" aria-hidden="true"></span></a>
      <a class="dock-button stream-tab" id="streamButton" href="../" aria-label="stream"><span id="streamIcon" aria-hidden="true"></span></a>
      <a class="dock-button settings-tab" id="settingsButton" href="../settings/" data-settings aria-label="设置" aria-current="page"><span id="settingsIcon" aria-hidden="true"></span></a>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">请启用 JavaScript 查看信息流。 / Enable JavaScript to view the feed.</p></noscript>
  <script type="module" src="../app.mjs"></script>
</body>
</html>
